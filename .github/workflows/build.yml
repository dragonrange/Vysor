# Compila o Vysor e monta o instalador, aqui no GitHub.
#
# POR QUE ISTO EXISTE
# Até agora o instalador era compilado na máquina do dono do projeto e enviado
# à mão. Isso funciona, mas fecha a porta da assinatura digital gratuita: o
# SignPath Foundation (grátis para código aberto) não assina binário que veio
# do computador de alguém — a assinatura precisa sair de um processo público e
# auditável, pra garantir que o que foi assinado corresponde ao código que está
# publicado aqui. Sem isso, "assinado" não significaria nada.
#
# De quebra, resolve dois problemas que já apareceram de verdade: a versão do
# instalador desencontrada da versão do app (aconteceu duas vezes, e fez o app
# ficar oferecendo a mesma atualização pra sempre), e o "esqueci de copiar o
# ffmpeg" — agora as duas coisas são automáticas.

name: Compilar Vysor

on:
  push:
    tags: ['v*']          # publicar uma tag vX.Y.Z gera a release sozinha
  workflow_dispatch:      # e dá pra rodar na mão, sem publicar nada

permissions:
  contents: write         # necessário só pra criar a release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar o aplicativo
        shell: pwsh
        run: |
          dotnet publish VysorClient/VysorClient.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o VysorClient/publish

      # O ffmpeg não fica no repositório (são mais de 100 MB), então vem de
      # fora. Sem ele o app ainda abre, mas cai no caminho antigo de imagem —
      # bem pior. Por isso o passo falha de propósito se o download não vier:
      # é melhor não gerar instalador nenhum do que gerar um capenga em
      # silêncio.
      - name: Baixar o ffmpeg
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe não veio no pacote baixado' }
          Copy-Item $exe.FullName VysorClient/publish/ffmpeg.exe
          Write-Host "ffmpeg: $([math]::Round((Get-Item VysorClient/publish/ffmpeg.exe).Length/1MB)) MB"

      - name: Conferir a versão publicada
        shell: pwsh
        run: |
          $v = (Get-Item VysorClient/publish/Vysor.exe).VersionInfo.FileVersion
          Write-Host "Versão compilada: $v"
          # Numa tag, a versão do .csproj TEM que bater com o nome da tag. Foi
          # justamente esse desencontro que, no passado, fez o app oferecer a
          # mesma atualização repetidamente: ele baixava, instalava, e continuava
          # se achando desatualizado.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/v',''
            if (-not $v.StartsWith($tag)) {
              throw "A tag diz v$tag mas o app foi compilado como $v. Ajuste o <Version> em VysorClient.csproj."
            }
          }

      - name: Instalar o Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Montar o instalador
        shell: pwsh
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" VysorClient/installer/Vysor.iss
          if (-not (Test-Path VysorClient/installer/Output/VysorSetup.exe)) { throw 'O instalador não foi gerado' }

      # Versão que não precisa instalar. Existe para quem é bloqueado pelo
      # Smart App Control do Windows 11 (erro 4551), que recusa executáveis sem
      # assinatura digital.
      - name: Montar a versão portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory portatil | Out-Null
          Copy-Item VysorClient/publish/Vysor.exe portatil/
          Copy-Item VysorClient/publish/ffmpeg.exe portatil/
          Copy-Item LICENSE portatil/
          Compress-Archive -Path portatil/* -DestinationPath VysorPortatil.zip

      - name: Guardar os arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: vysor
          path: |
            VysorClient/installer/Output/VysorSetup.exe
            VysorPortatil.zip

      - name: Publicar a release (só quando é uma tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            VysorClient/installer/Output/VysorSetup.exe `
            VysorPortatil.zip `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
